<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061325"><title>凌渊 | 双技能三维测试</title><link rel="stylesheet" href="style.css"></head><body>
<main class="shell"><canvas id="scene" aria-label="拖动以旋转三维镜头，滚轮或双指缩放"></canvas><div class="vignette"></div>
<header><div class="identity"><span class="mark">渊</span><div><small><span id="skill-subtitle">LINGYUAN · SKILL 01</span></small><h1 id="skill-name">破云·龙影斩</h1></div></div><div class="status"><span class="dot"></span><span id="backend">正在初始化</span><span class="draft">技能工作稿</span></div></header>
<div class="stage-label"><span>三维技能测试</span><strong id="phase">准备就绪</strong><small>拖动镜头观察 · 滚轮 / 双指缩放</small></div>
<div class="toolbar"><div class="main-buttons"><button id="cast" class="primary selected" data-skill="1">一技能 <span>↗</span></button><button id="cast2" class="primary" data-skill="2">二技能 <span>✦</span></button><button id="pause" aria-label="暂停">暂停</button><button id="step" title="暂停后逐帧">逐帧</button><button id="slow">慢动作</button><button id="loop">循环：关</button></div><div class="timeline"><span id="time">0.00</span><input id="seek" type="range" min="0" max="4.4" value="0" step="0.01" aria-label="技能时间"><span id="duration">4.40 s</span></div></div>
<aside><div class="aside-title">观察视角 <span>01 / CAMERA</span></div><div class="views"><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button data-view="top">俯视</button></div><div class="aside-title quality-title">画质 <span>02 / QUALITY</span></div><div class="quality"><button data-quality="high" class="selected">高清</button><button data-quality="ultra">极致</button></div><div class="aside-title layers-title">二技能图层 <span>03 / LAYERS</span></div><div class="layers"><label><input type="checkbox" data-layer="dragon" checked>青龙</label><label><input type="checkbox" data-layer="circle" checked>法阵</label><label><input type="checkbox" data-layer="crystals" checked>晶体</label><label><input type="checkbox" data-layer="beams" checked>光柱</label><label><input type="checkbox" data-layer="chains" checked>锁链</label><label><input type="checkbox" data-layer="particles" checked>粒子</label></div><div class="metrics"><div><small>帧率</small><b id="fps">—</b></div><div><small>绘制调用</small><b id="calls">—</b></div><div><small>时间</small><b id="phase-time">0.00</b></div></div><p class="note">角色与龙魂均为制作中模型，画面和握枪动作尚未达到参考图。</p><p id="error" class="error" hidden></p></aside>
<div id="loading" class="loading"><div><span class="spinner"></span><strong id="loading-text">载入三维角色与技能…</strong><p>首次打开需要下载模型，请保持网络连接。</p><a href="?renderer=webgl2">尝试 WebGL2 兼容模式</a></div></div>
<div id="rotate" class="rotate"><div><div class="rotate-icon">↻</div><strong>请横屏体验</strong><p>旋转手机，完整观察技能轨迹。</p><button id="landscape">进入横屏</button><button id="portrait-anyway" class="subtle">暂时竖屏预览</button></div></div>
</main><script>(function(){setTimeout(function(){var s=window.__lingSkill;if(!s||!s.ready){var e=document.getElementById("loading-text");if(e)e.textContent="加载较慢，可尝试兼容模式或重新打开";}},18000)}());</script><script type="module" src="app.js"></script></body></html>
