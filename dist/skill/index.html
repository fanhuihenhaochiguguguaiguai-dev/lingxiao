<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061325"><title>凌渊 · 角色工作室</title><link rel="stylesheet" href="style.css"></head><body>
<main class="shell"><canvas id="scene" aria-label="拖动以旋转镜头，滚轮或双指缩放"></canvas><div class="vignette"></div>
<header><div class="identity"><span class="mark">渊</span><div><small id="skill-subtitle">LINGYUAN · SKILL 01</small><h1 id="skill-name">破云·龙影斩</h1></div></div><div class="header-actions"><span id="backend">正在初始化</span><button id="camera-reset" hidden title="恢复默认镜头">⌖ <span>复位</span></button><button id="panel-toggle" aria-expanded="false" aria-controls="panel">设置</button><button id="clean-mode">纯净</button></div></header>
<div class="stage-label"><strong id="phase">准备就绪</strong><small>WASD 移动 · Shift 加速 · 1/2/3 技能 · 拖动环绕</small></div>
<div id="joystick" class="joystick" role="application" aria-label="虚拟方向摇杆"><span id="joystick-knob" class="joystick-knob"></span></div>
<div class="skill-buttons" aria-label="主动技能"><button id="cast" class="primary selected" data-skill="1"><span>01</span>破云</button><button id="cast2" class="primary" data-skill="2"><span>02</span>缚星</button><button id="cast3" class="primary ultimate" data-skill="3"><span>03</span>苍穹</button></div>
<aside id="panel" hidden><div class="panel-head"><strong>设置</strong></div>
<div class="aside-title">声音</div><div class="sound"><button id="mute">静音</button><input id="volume" type="range" min="0" max="1" value="0.65" step="0.05" aria-label="音量"></div><p id="audio-status" class="audio-status" aria-live="polite">音效加载中</p>
<div class="aside-title">画质</div><div class="quality"><button data-quality="high" class="selected">高清</button><button data-quality="ultra">极致</button></div>
<div class="aside-title">切换人物</div><button id="open-characters" class="choose-character">选择人物</button></aside>
<div id="character-picker" class="character-picker" hidden role="dialog" aria-modal="true" aria-labelledby="character-heading"><div class="character-card"><div class="picker-head"><strong id="character-heading">选择人物</strong><button id="close-characters" aria-label="关闭">×</button></div><button class="character-option selected" data-character="lingyuan"><span>凌渊</span><small>三技能展示</small></button><button class="character-option" data-character="yueli"><span>月璃</span><small>静态工作稿 · 动作未完成</small></button><p id="character-message" class="character-message" aria-live="polite"></p></div></div>
<div id="diagnostics" hidden><button id="pause">暂停</button><button id="step">逐帧</button><button id="slow">慢动作</button><button id="loop">循环：关</button><span id="time">0.00</span><input id="seek" type="range" min="0" max="4.4" value="0" step="0.01"><span id="duration">4.40 s</span><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="right">右侧</button><button data-view="back">背面</button><button data-view="angle">45°</button><button data-view="top">俯视</button><button data-view="up">仰视</button><button data-follow="free">自由</button><button data-follow="actor">人物</button><button data-follow="dragon">龙首</button><input type="checkbox" data-layer="dragon" checked><input type="checkbox" data-layer="circle" checked><input type="checkbox" data-layer="crystals" checked><input type="checkbox" data-layer="beams" checked><input type="checkbox" data-layer="chains" checked><input type="checkbox" data-layer="particles" checked><b id="fps">—</b><b id="calls">—</b><b id="phase-time">0.00</b><p id="error" hidden></p></div>
<div id="audio-alert" class="audio-alert" role="status" hidden>部分音效不可用，请在设置中检查或重新加载。</div>
<div id="runtime-error" class="runtime-error" role="alert" hidden><span id="runtime-error-text"></span><button id="runtime-retry">重新加载</button></div>
<div id="loading" class="loading"><div><span class="spinner"></span><strong id="loading-text">载入三维角色与技能…</strong><p>首次打开需要下载模型，请保持网络连接。</p><a href="?renderer=webgl2">尝试 WebGL2 兼容模式</a></div></div>
<div id="rotate" class="rotate"><div><div class="rotate-icon">↻</div><strong>请横屏体验</strong><p>旋转手机，完整观察技能轨迹。</p><button id="landscape">进入横屏</button><button id="portrait-anyway" class="subtle">暂时竖屏预览</button></div></div>
</main><script>(function(){setTimeout(function(){var s=window.__lingSkill;if(!s||!s.ready){var e=document.getElementById('loading-text');if(e)e.textContent='加载较慢，可尝试兼容模式或重新打开';}},18000)}());</script><script type="module" src="app.js"></script></body></html>
